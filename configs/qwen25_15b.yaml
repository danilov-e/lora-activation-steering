model:
  id: Qwen/Qwen2.5-1.5B-Instruct
  # The checkpoint used in our pilot; also used for the tokenizer.
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  device: auto       # CUDA if available, otherwise CPU
  dtype: auto        # FP16 on CUDA, FP32 on CPU

run:
  seed: 42
  batch_size: 2

generation:
  max_new_tokens: 1000
  min_new_tokens: 1
  do_sample: true
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  repetition_penalty: 1.0
  use_cache: true
