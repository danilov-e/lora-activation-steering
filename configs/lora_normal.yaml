# Train one adapter on the prepared normal split, without activation steering.
adapter:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  use_rslora: true
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
training:
  seed: 0
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 5
  max_length: 2048
