[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-activation-steering"
version = "0.1.0"
description = "Experiments on the interaction between LoRA and activation steering"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6,<3",
    "transformers==4.52.3",
    "PyYAML==6.0.2",
    "numpy==2.2.6",
    "pandas==2.3.1",
    "matplotlib==3.10.3",
    "tqdm==4.67.1",
    "openai==1.70.0",
]

[project.optional-dependencies]
train = [
    "peft==0.15.2",
    "accelerate==1.7.0",
    "datasets==3.6.0",
]
test = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
